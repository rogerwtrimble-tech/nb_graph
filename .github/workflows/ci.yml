name: ci
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r graph-api/requirements-dev.txt
      - run: cd graph-api && pytest -q   # integration tests auto-skip without a running stack

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cd ui && npm ci && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/nb-graph
      - run: |
          helm template t charts/nb-graph > /dev/null
          helm template t charts/nb-graph --set auth.mode=oidc --set auth.oidc.issuer=https://idp.example/realms/x \
            --set ingress.enabled=false --set service.type=LoadBalancer --set image.registry=ghcr.io/x > /dev/null
