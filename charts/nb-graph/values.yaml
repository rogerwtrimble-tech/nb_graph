# nb_graph Helm chart. The defaults mirror docker-compose.yml and suit Rancher Desktop (k3s + Traefik).
#
# Images: by default the chart uses the images `docker compose build` creates (nb_graph/*). On Rancher
# Desktop with the dockerd (moby) engine, k3s shares Docker's image store, so no registry is needed.
# Elsewhere, push them to a registry and set image.registry (or each repository).

image:
  registry: ""            # e.g. ghcr.io/you  -> ghcr.io/you/nb_graph/graph-api:0.1
  pullPolicy: IfNotPresent
  pullSecrets: []

# Secrets. Empty values are generated on first install and kept across upgrades.
# To pin them (or use GitOps), set them here or point existingSecret at a Secret with the same keys.
secrets:
  existingSecret: ""
  dbPassword: ""          # letters/digits only: it is embedded in a postgres:// URL
  redisPassword: ""
  redisCachePassword: ""
  secretKey: ""
  apiTokenPepper: ""
  superuserPassword: ""   # NetBox admin password (generated if empty: see NOTES after install)
  superuserApiKey: ""     # 12 alphanumerics
  superuserApiToken: ""   # 40 alphanumerics
  webhookSecret: ""
  netboxSsoClientSecret: ""   # only used with netbox.sso.enabled (also settable as netbox.sso.clientSecret)

postgres:
  image: {repository: docker.io/postgres, tag: 19beta4-alpine}
  persistence: {enabled: true, size: 10Gi, storageClass: ""}
  resources: {}

valkey:
  image: {repository: docker.io/valkey/valkey, tag: 9.1-alpine}
  persistence: {enabled: true, size: 1Gi, storageClass: ""}   # the task queue; the cache is never persisted
  resources: {}

netbox:
  image: {repository: nb_graph/netbox, tag: 4.7-local}
  superuserName: admin
  superuserEmail: admin@example.com
  timeZone: America/Chicago
  # netbox-docker binds granian to "::". Set true on clusters/nodes with IPv6 disabled entirely
  # (symptom: "Address family not supported by protocol (os error 97)").
  ipv4Only: false
  # Public URL users open NetBox at. Empty = derived from ingress.netboxHost.
  publicUrl: ""
  media: {size: 5Gi, storageClass: ""}
  # Single sign-on to NetBox's own UI through the same IdP (auth.oidc.issuer / internalUrl / groups).
  # Needs a confidential client in the IdP with redirect URI <netbox public URL>/oauth/complete/oidc/
  sso:
    enabled: false
    clientId: netbox
    clientSecret: ""      # or put it in secrets.existingSecret under key netbox-sso-client-secret
    label: Single sign-on
  worker: {enabled: true, resources: {}}
  resources: {}

graphApi:
  image: {repository: nb_graph/graph-api, tag: "0.1"}
  resources: {}

ui:
  image: {repository: nb_graph/ui, tag: "0.1"}
  resources: {}

seed:
  enabled: true          # one-shot FTTH demo data (Helm post-install/post-upgrade hook, idempotent)
  demoData: true         # false = only the webhook and OIDC role groups, no demo network

# Optional per-user OIDC auth (docs/auth.md). Point it at your IdP (Keycloak, Entra ID, Okta, ...).
auth:
  mode: none             # none | oidc
  oidc:
    issuer: ""           # as the browser sees it; must equal the token's "iss"
    internalUrl: ""      # same issuer as reached from inside the cluster, if different
    clientId: nb-graph
    groups: nbgraph-editors,nbgraph-viewers

service:
  type: ClusterIP        # LoadBalancer works on Rancher Desktop (servicelb) if you prefer ports to Ingress
  uiPort: 8080
  netboxPort: 8000

ingress:
  enabled: true
  className: ""          # empty = cluster default (Traefik on Rancher Desktop / k3s)
  annotations: {}
  uiHost: nb-graph.localhost          # *.localhost resolves to 127.0.0.1 in browsers
  netboxHost: netbox.nb-graph.localhost
  tls: []                # [{secretName: nb-graph-tls, hosts: [nb-graph.example.com, netbox.example.com]}]

nodeSelector: {}
tolerations: []
affinity: {}
