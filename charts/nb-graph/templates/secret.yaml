{{- if not .Values.secrets.existingSecret }}
{{- $name := include "nbg.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $s := .Values.secrets }}
{{- $keys := dict
  "db-password"          (list $s.dbPassword (randAlphaNum 24))
  "redis-password"       (list $s.redisPassword (randAlphaNum 24))
  "redis-cache-password" (list $s.redisCachePassword (randAlphaNum 24))
  "secret-key"           (list $s.secretKey (randAlphaNum 64))
  "api-token-pepper"     (list $s.apiTokenPepper (randAlphaNum 64))
  "superuser-password"   (list $s.superuserPassword (randAlphaNum 16))
  "superuser-api-key"    (list $s.superuserApiKey (randAlphaNum 12))
  "superuser-api-token"  (list $s.superuserApiToken (randAlphaNum 40))
  "webhook-secret"       (list $s.webhookSecret (randAlphaNum 32))
  "netbox-sso-client-secret" (list (coalesce $s.netboxSsoClientSecret .Values.netbox.sso.clientSecret) "unset") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "nbg.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # uninstall must not orphan the database from its password
type: Opaque
data:
{{- range $k, $v := $keys }}
  {{- /* explicit value > value already in the cluster > newly generated */}}
  {{ $k }}: {{ if index $v 0 }}{{ index $v 0 | b64enc }}{{ else if hasKey $old $k }}{{ index $old $k }}{{ else }}{{ index $v 1 | b64enc }}{{ end }}
{{- end }}
{{- end }}
