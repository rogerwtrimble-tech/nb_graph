{{- $c := dict "root" . "component" "ui" }}
{{- $api := include "nbg.name" (dict "root" . "component" "graph-api") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nbg.name" $c }}
  labels: {{- include "nbg.labels" $c | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "nbg.selector" $c | nindent 4 }}
  ports: [{name: http, port: {{ .Values.service.uiPort }}, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nbg.name" $c }}
  labels: {{- include "nbg.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "nbg.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nbg.labels" $c | nindent 8 }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/ui-configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      {{- include "nbg.pod" . | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "nbg.image" (dict "root" . "img" .Values.ui.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: nginx
          configMap: {name: {{ include "nbg.name" $c }}-nginx}
