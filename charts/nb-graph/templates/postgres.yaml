{{- $c := dict "root" . "component" "postgres" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nbg.name" $c }}-initdb
  labels: {{- include "nbg.labels" $c | nindent 4 }}
data:
  # same as db/initdb/00-extensions.sql
  00-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS ltree;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nbg.name" $c }}
  labels: {{- include "nbg.labels" $c | nindent 4 }}
spec:
  selector: {{- include "nbg.selector" $c | nindent 4 }}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nbg.name" $c }}
  labels: {{- include "nbg.labels" $c | nindent 4 }}
spec:
  serviceName: {{ include "nbg.name" $c }}
  replicas: 1
  selector:
    matchLabels: {{- include "nbg.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nbg.labels" $c | nindent 8 }}
    spec:
      {{- include "nbg.pod" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "nbg.image" (dict "root" . "img" .Values.postgres.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: POSTGRES_DB, value: netbox}
            - {name: POSTGRES_USER, value: netbox}
            {{- include "nbg.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "db-password") | nindent 12 }}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-q", "-t", "2", "-d", "netbox", "-U", "netbox"]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}   # PG18+ images keep data in <major>/ below this
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap: {name: {{ include "nbg.name" $c }}-initdb}
        {{- if not .Values.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.persistence.size }}}}
  {{- end }}
