# Rancher Apps & Marketplace install form
categories: [Networking]
namespace: nb-graph
questions:
  - variable: ingress.enabled
    label: Expose with Ingress
    type: boolean
    default: true
    group: Access
    show_subquestion_if: true
    subquestions:
      - variable: ingress.uiHost
        label: UI hostname
        type: hostname
        default: nb-graph.localhost
      - variable: ingress.netboxHost
        label: NetBox hostname
        type: hostname
        default: netbox.nb-graph.localhost
  - variable: service.type
    label: Service type
    type: enum
    options: [ClusterIP, LoadBalancer, NodePort]
    default: ClusterIP
    group: Access
  - variable: image.registry
    label: Registry for nb_graph images
    description: Published images live in ghcr.io/rogerwtrimble-tech. Empty = images built locally with `docker compose build` (Rancher Desktop, dockerd engine; then also set the tags as in values-local.yaml).
    type: string
    default: ghcr.io/rogerwtrimble-tech
    group: Images
  - variable: image.tag
    label: nb_graph image tag
    description: main (latest build of the main branch), sha-<commit>, or a release such as 0.2.0
    type: string
    default: main
    group: Images
  - variable: seed.demoData
    label: Load the FTTH demo network
    type: boolean
    default: true
    group: Data
  - variable: postgres.persistence.size
    label: PostgreSQL volume size
    type: string
    default: 10Gi
    group: Data
  - variable: netbox.ipv4Only
    label: NetBox listens on IPv4 only
    description: Turn on if NetBox crashes with "Address family not supported by protocol" (nodes without IPv6).
    type: boolean
    default: false
    group: NetBox
  - variable: auth.mode
    label: Per-user sign-in
    type: enum
    options: [none, oidc]
    default: none
    group: Authentication
    show_subquestion_if: oidc
    subquestions:
      - variable: auth.oidc.issuer
        label: OIDC issuer URL (as the browser sees it)
        type: string
        required: true
      - variable: auth.oidc.internalUrl
        label: Issuer URL from inside the cluster (if different)
        type: string
      - variable: auth.oidc.clientId
        label: OIDC client id (public client, PKCE)
        type: string
        default: nb-graph
  - variable: netbox.sso.enabled
    label: Single sign-on to NetBox's own UI
    description: Uses the issuer above. Needs a confidential IdP client with redirect URI <NetBox URL>/oauth/complete/oidc/
    type: boolean
    default: false
    group: Authentication
    show_subquestion_if: true
    subquestions:
      - variable: netbox.sso.clientId
        label: NetBox client id
        type: string
        default: netbox
      - variable: netbox.sso.clientSecret
        label: NetBox client secret
        type: password
